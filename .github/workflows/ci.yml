name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Asia/Manila

jobs:
  checks:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: payrollph
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: payrollph
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U payrollph -d payrollph"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: '5432'
      POSTGRES_USER: payrollph
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: payrollph
      # PostgreSQL 18 client so the real backup dump/restore test runs (skipped without it).
      PG_BIN_DIR: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Generate throwaway secrets
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          "$PG_BIN_DIR/pg_dump" --version

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: ShellCheck deploy script
        run: shellcheck -x deploy/deploy.sh

      - name: Engine tests
        run: pnpm --filter @payrollph/shared test

      - name: API route tests (PostgreSQL 18)
        run: pnpm --filter @payrollph/api test

      - name: Web build
        run: pnpm --filter @payrollph/web build

  deploy-smoke:
    name: Deploy with deploy.sh + Playwright smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    services:
      # Stands in for the server's own PostgreSQL 18 (the app's containers reach it through
      # host.docker.internal, exactly as on the VPS).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Create the role and database (what the owner does on the server)
        run: |
          SMOKE_PW="$(openssl rand -hex 24)"
          echo "::add-mask::$SMOKE_PW"
          echo "SMOKE_PW=$SMOKE_PW" >> "$GITHUB_ENV"
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE payrollph LOGIN PASSWORD '$SMOKE_PW'" \
            -c "CREATE DATABASE payrollph OWNER payrollph"

      - name: deploy.sh --non-interactive
        run: POSTGRES_PASSWORD="$SMOKE_PW" ./deploy/deploy.sh --non-interactive --domain payroll.test --admin-email ci@example.com

      - name: Second run is idempotent
        run: ./deploy/deploy.sh --non-interactive

      - name: Backup and status
        run: |
          ./deploy/deploy.sh backup
          ./deploy/deploy.sh status

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @payrollph/web exec playwright install --with-deps chromium

      - name: Smoke test (setup wizard → employee → payroll → payslip PDF)
        run: BASE_URL=http://localhost:8080 pnpm --filter @payrollph/web e2e

      - name: Container logs
        if: failure()
        run: docker compose -p payrollph -f docker-compose.yml logs --no-color --tail=300

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
